<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!--ssg-head-->

    <!-- Theme & Mobile -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#b03a16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Pre-paint theme: light is the default (also the SSR snapshot).
      // Adds .dark before first paint only for a stored opt-in or the
      // OS preference — no FOUC, no hydration mismatch.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "dark") { document.documentElement.classList.add("dark"); return; }
          if (saved === "light") { document.documentElement.classList.remove("dark"); return; }
        } catch (e) {}
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- Geo Targeting -->
    <meta name="geo.region" content="IN-MH" />
    <meta name="geo.placename" content="Mumbai" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
