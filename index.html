    <script>
      // Pre-paint theme: dark is the default (the <html> element ships with
      // class="dark", so the prerendered page and no-JS agree). Only an
      // explicit stored "light" choice removes it, before first paint.
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") document.documentElement.classList.remove("dark");
        } catch (e) {}
      })();
    </script>
