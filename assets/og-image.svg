<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     text-rendering="geometricPrecision" shape-rendering="geometricPrecision">

  <title>Vikas Jaiswal — Java · Spring Boot · Backend Developer</title>

  <defs>
    <style>
      /* Fallbacks are deliberate: if Newsreader / Inter / JetBrains Mono
         aren't installed, Georgia + Helvetica/Arial + Menlo keep the
         same metrics family and the layout still holds. */
      .eyebrow { font: 500 17px 'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,'Courier New',monospace;
                 letter-spacing: 3.2px; fill: #949aa2; }
      .sep     { fill: #f0784b; }
      .head    { font: 500 112px 'Newsreader','Source Serif 4',Georgia,'Times New Roman',serif;
                 letter-spacing: -0.6px; fill: #edeae4; }
      .sub     { font: 400 26px 'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
                 letter-spacing: 0.15px; fill: #b6bac0; }
      .dom     { font: 500 19px 'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace;
                 letter-spacing: 1px; fill: #f0784b; }
      .cert    { font: 400 17px 'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace;
                 letter-spacing: 1.2px; fill: #949aa2; }
    </style>
  </defs>

  <!-- Warm near-black ground -->
  <rect width="1200" height="630" fill="#161310"/>

  <!-- Callout marker: 4px accent bar, left edge of the text block -->
  <rect x="90" y="153" width="4" height="233" fill="#f0784b"/>

  <!-- Eyebrow -->
  <text class="eyebrow" x="128" y="169">JAVA <tspan class="sep">·</tspan> SPRING BOOT <tspan class="sep">·</tspan> BACKEND DEVELOPER</text>

  <!-- Headline -->
  <text class="head" x="126" y="273">Vikas Jaiswal</text>

  <!-- Subtitle, broken on sense -->
  <text class="sub" x="128" y="329">4+ years building secure, scalable backend systems</text>
  <text class="sub" x="128" y="369">across FinTech, Healthcare, EdTech and Logistics</text>

  <!-- Divider: hairline across the measure, accent head on the first 88px -->
  <rect x="128" y="424"   width="982" height="1.5" fill="#37302c"/>
  <rect x="128" y="423.5" width="88"  height="2.5" fill="#f0784b"/>

  <!-- Footer row -->
  <text class="dom"  x="128"  y="469">vikas794.github.io</text>
  <text class="cert" x="1110" y="469" text-anchor="end">Azure AZ-900 <tspan class="sep">·</tspan> DP-900 Certified</text>
</svg>