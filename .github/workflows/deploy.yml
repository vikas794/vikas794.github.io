# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run lint
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Assert prerendered routes
        run: |
          for r in about experience projects resume contact projects/market-ticks-fanout projects/healthcare-backend-trust projects/sql-injection-surface; do
            f="dist/$r/index.html"
            test -f "$f" || (echo "missing $f" && exit 1)
            grep -q "<title>" "$f" || (echo "no <title> in $f" && exit 1)
          done
          test -f dist/404.html || (echo "missing dist/404.html" && exit 1)
          if grep -r "data-msg=" dist; then echo "client-render fallback in dist" && exit 1; fi
          test -f dist/sitemap.xml || (echo "missing dist/sitemap.xml" && exit 1)
          test "$(grep -c '<loc>' dist/sitemap.xml)" = "9" || (echo "sitemap should list 9 URLs" && exit 1)
          grep -q "https://vikas794.github.io/sitemap.xml" dist/robots.txt || (echo "robots missing sitemap ref" && exit 1)
          test -f dist/llms.txt || (echo "missing dist/llms.txt" && exit 1)
          test -f dist/google55cf3945321b0fe5.html || (echo "search-console file missing" && exit 1)
          echo "prerender assertions passed"
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
