# Runs lint + tests + full build on every PR (incl. Dependabot) so a broken
# change can never reach main -> deploy.yml.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run budget

  lighthouse:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Serve dist and run Lighthouse (desktop, home page)
        run: |
          npx vite preview --port 4173 &
          npx wait-on http://localhost:4173/
          npx lighthouse@12 http://localhost:4173/ --preset=desktop             --only-categories=performance,accessibility,best-practices,seo             --chrome-flags="--headless=new --no-sandbox"             --output=json --output-path=lh-home.json --quiet
          node scripts/check-lighthouse.mjs lh-home.json
